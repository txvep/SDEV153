<!DOCTYPE html>
<html lang="en">
   <head>
  <meta charset="UTF-8"/>
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0"/>
        <title>Bailey's Bakery Shop</title>
     <link rel="stylesheet"
       href="Style.css">
  </head>
  <body>
  <header>
    <nav class="nav-container">
      <a href="#"
        class="logo">
      </a>
    <ul class="nav-links">
      <li><a
        href="/profile">profile</a></li>
            <li><a
        href="/cart_item" id="cartLink">My Cart</a></li>
            <li><a
        href="/Search">Search</a></li>
    </ul>
    </nav>
  </header>
      <main>
         <h1>Bailey's Bakery Shop</h1>
         </main>

     <section class = "our-favorites-section">
        <h1 class = "section-title">Our Favorites</h1>
        <div class = "product container">
           <div class = "product-card">
              <img src = "images/dog-house.JPG" class="product-img" alt="outdoor dog house with roof">
                 <p class = "product-name">Dog House</p>
               <p class = "price">$4.50</p>
           </div>
           <div class = "product-card">
              <img src = "images/Pawfficer.JPG" class="product-img" alt="pawfficer on duty badge">
                 <p class = "product-name">Pawfficer</p>
              <p class = "price">$4.50</p>
           </div>
           <div class = "product-card">
              <img src = "images/coffee-and-dogs.JPG" class="product-img" alt="coffee and dogs shop cup with small paws">
                 <p class = "product-name">Coffee & Dogs</p>
              <p class = "price">$4.50</p>
                 </div>
              </section>
              
          <section class = "best-sellers-section">
        <h1 class = "section-title">Best Sellers</h1>
        <div class = "product container">
           <div class = "product-card">
              <img src = "images/squirrel-patrol.JPG" class="product-img" alt="scout badge for squirrel patrol">
                 <p class = "product-name">Squirrel Patrol</p>
              <p class = "price"> $4.50</p>
           </div>
           <div class = "product-card">
              <img src = "images/smiley-face.JPG" class="product-img" alt="large and small rounded smiley face">
                 <p class = "product-name">Smiley Face</p>
              <p class = "price"> $3.50-$5.00</p>
           </div>
              <div class = "product-card">
              <img src = "images/santa-paws.jpeg" class="product-img" alt="dog bone with santa paws in the middle and santa hat">
                 <p class = "product-name">Santa Paws</p>
              <p class = "price"> $4.50</p>
              </div>
            </section>

     <footer>
        <p>Follow Us :
        <a href="www.instagram.com/bfcookiecutters">
           </a>
        </p>
        <p> &copy; Copyright 2026| All Rights Reserved</p>
     </footer>
      
  </body>
</html>
