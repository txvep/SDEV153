<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Online Store - Home Page</title>
    <link rel="stylesheet" href="form.css">
    <link rel="stylesheet" href="Style.css">
  </head>
  <body>

    <img src="images/loading.gif" class="loader" alt="">
    
    <section class="form-section">
      <div class="form-container">
        <div class="form">
          <h1 class="form-heading">New here, Sign Up</h1>
          <input type="text" autocomplete="off" id="name" placeholder="first name">
          <input type="text" autocomplete="off" id="name" placeholder="last name">
          <input type="text" autocomplete="off" id="email" placeholder="email">
          <input type="text" autocomplete="off" id="password" placeholder="password">
          <input type="text" autocomplete="off" id="phone" placeholder="phone number"> 
          <span class="error">**this is an error></span>

          <div>
            <input type="checkbox" id="tc"><label for="tc" class="tc-text">You agree to our <a href="#">terms and conditons</a>
          </div>

         <button class="submit-btn">sign up</button>
          <a href="/login.html" class="other-form-link">Already have an account. Log in here</a>
      </div>
      <img src="images/signup.jpeg" class="form-img" alt="">
      </div>
    </section>
  </body>
